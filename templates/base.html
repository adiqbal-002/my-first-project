<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Finance Management System</h1>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('students') }}">Fee Management</a>
      <a href="{{ url_for('collect_fee') }}">Collect Fee</a>
      <a href="{{ url_for('summary_report') }}">Reports</a>
      <a href="{{ url_for('hostel_students') }}">Hostel Students</a>
      <a href="{{ url_for('invoices') }}">Invoices</a>
      <a href="{{ url_for('cashbook') }}">Cashbook</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flashes">
          {% for message in messages %}<li>{{ message }}</li>{% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
