{% extends 'base.html' %}
{% block content %}
<h2>Collect Fee & Generate Receipt</h2>
<form method="post" class="panel">
  <select name="student_id" required>
    {% for s in students %}
      <option value="{{ s.id }}">{{ s.name }} | {{ s.class_year }} | Due: {{ '%.2f'|format(s.assigned_total - s.paid_total) }}</option>
    {% endfor %}
  </select>
  <input name="amount" type="number" step="0.01" placeholder="Amount" required>
  <input name="payment_date" type="date" value="{{ today }}" required>
  <select name="payment_mode"><option>Cash</option><option>Bank</option><option>Online</option></select>
  <textarea name="notes" placeholder="Notes"></textarea>
  <button>Collect Fee</button>
</form>
{% endblock %}
